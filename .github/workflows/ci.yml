name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Python and configuration
        run: |
          python -m py_compile qwen_bench.py
          python -m py_compile qwen_quant.py
          python -m py_compile qwen_vision.py
          python -m py_compile qwen_rocm.py
          python -m py_compile qwen_inventory.py
          python qwen_bench.py self-test
          python qwen_quant.py self-test
          python qwen_vision.py self-test
          python qwen_rocm.py self-test
          python qwen_inventory.py self-test
          python -m json.tool matrix.json >/dev/null
          python -m json.tool prompts.json >/dev/null
          python -m json.tool vision_cases.json >/dev/null
          python -c 'import pathlib, qwen_bench; qwen_bench.load_config(pathlib.Path("matrix.json"))'

  rocmfpx-integration-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ROCmFPX source
        run: |
          git clone https://github.com/kingjones30/ROCmFPX.git rocmfpx
          git -C rocmfpx checkout 36e9acd40e10a87cd3c3ef8ec734668757dc8520
      - name: Apply and compile ROCmFPX integrations
        run: |
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp-schedule-output.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp-schedule-output.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-host-checkpoints.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-host-checkpoints.patch"
          cmake -S rocmfpx -B rocmfpx/build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_HIP=OFF \
            -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build rocmfpx/build-ci --parallel 2 --target llama-cli
