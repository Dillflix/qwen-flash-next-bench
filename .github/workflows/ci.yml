name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Python and configuration
        run: |
          python -m py_compile qwen_bench.py
          python -m py_compile qwen_quant.py
          python -m py_compile qwen_vision.py
          python -m py_compile qwen_rocm.py
          python -m py_compile qwen_inventory.py
          python qwen_bench.py self-test
          python qwen_quant.py self-test
          python qwen_vision.py self-test
          python qwen_rocm.py self-test
          python qwen_inventory.py self-test
          python -m json.tool matrix.json >/dev/null
          python -m json.tool prompts.json >/dev/null
          python -m json.tool vision_cases.json >/dev/null
          python -c 'import pathlib, qwen_bench; qwen_bench.load_config(pathlib.Path("matrix.json"))'
      - name: Validate production deployment
        run: |
          bash -n deployment/run-production.sh
          LLAMA_SERVER=/bin/true \
          MODEL=/etc/hosts MTP=/etc/hosts MMPROJ=/etc/hosts \
          ROCM_PATH=/usr HIP_PATH=/usr REQUIRE_AUTO_VISION_BYPASS=0 \
          LLAMA_HOST=0.0.0.0 LLAMA_API_KEY=test-key \
            deployment/run-production.sh --check
          LLAMA_SERVER=/bin/true \
          MODEL=/etc/hosts MTP=/etc/hosts MMPROJ=/etc/hosts \
          ROCM_PATH=/usr HIP_PATH=/usr REQUIRE_AUTO_VISION_BYPASS=0 LLAMA_HOST=0.0.0.0 \
            deployment/run-production.sh --api-key test-key --check
          if LLAMA_SERVER=/bin/true \
             MODEL=/etc/hosts MTP=/etc/hosts MMPROJ=/etc/hosts \
             ROCM_PATH=/usr HIP_PATH=/usr REQUIRE_AUTO_VISION_BYPASS=0 \
             LLAMA_HOST=0.0.0.0 \
               deployment/run-production.sh --check; then
            echo "non-loopback unauthenticated launch unexpectedly passed" >&2
            exit 1
          fi

  rocmfpx-integration-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned ROCmFPX source
        run: |
          git clone https://github.com/kingjones30/ROCmFPX.git rocmfpx
          git -C rocmfpx checkout 36e9acd40e10a87cd3c3ef8ec734668757dc8520
      - name: Apply and compile ROCmFPX integrations
        run: |
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp-schedule-output.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-mtp-schedule-output.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-mtp-vision-resync.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-mtp-vision-resync.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-vision-strict.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-vision-strict.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-vision-strict-checkpoint.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-qwen4exp-vision-strict-checkpoint.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-request-spec-bypass.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-request-spec-bypass.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-auto-mtmd-spec-bypass.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-auto-mtmd-spec-bypass.patch"
          git -C rocmfpx apply --unidiff-zero "$GITHUB_WORKSPACE/patches/rocmfpx-host-checkpoints-v1-broken.patch"
          git -C rocmfpx apply --reverse --check --unidiff-zero "$GITHUB_WORKSPACE/patches/rocmfpx-host-checkpoints-v1-broken.patch"
          git -C rocmfpx apply --reverse --unidiff-zero "$GITHUB_WORKSPACE/patches/rocmfpx-host-checkpoints-v1-broken.patch"
          git -C rocmfpx apply --check "$GITHUB_WORKSPACE/patches/rocmfpx-host-checkpoints.patch"
          git -C rocmfpx apply "$GITHUB_WORKSPACE/patches/rocmfpx-host-checkpoints.patch"
          cmake -S rocmfpx -B rocmfpx/build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_HIP=OFF \
            -DGGML_VULKAN=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build rocmfpx/build-ci --parallel 2 --target llama-cli llama-server
          grep -aFq 'MTP multimodal resync: skipping direct image decode' \
            rocmfpx/build-ci/bin/llama-server
          grep -aFq 'Qwen4Exp vision MTP: single-row target verification enabled' \
            rocmfpx/build-ci/bin/llama-server
          grep -aFq 'Qwen4Exp vision MTP: recurrent rollback disabled; using full-state checkpoints' \
            rocmfpx/build-ci/bin/llama-server
          grep -aFq 'speculative decoding disabled for request; target hidden-state export bypassed' \
            rocmfpx/build-ci/bin/llama-server
          grep -aFq 'multimodal request detected; speculative decoding disabled automatically' \
            rocmfpx/build-ci/bin/llama-server
