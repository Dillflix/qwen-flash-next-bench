[Service]
# Keep the existing service hardening, credentials, bind address and port.
# The separate Strix launcher ignores legacy model/cache/MTP/device settings.
ExecStartPre=
ExecStartPre=/usr/bin/python3 /usr/local/libexec/qwen-strix-production.py --check
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/qwen-strix-production.py
ExecStartPost=
ExecStartPost=/usr/bin/python3 /usr/local/libexec/qwen-strix-production.py --ready
Environment=PYTHONDONTWRITEBYTECODE=1
